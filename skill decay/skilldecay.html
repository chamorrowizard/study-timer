<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Decay</title>
<link rel="stylesheet" href="decay.css">
<meta name="theme-color" content="#6c5ce7">
<style>

</style>
</head>

<body>

<a href="../index.html"><button id="back-btn">Back</button></a>
<h1>Skill Decay Tracker</h1>

<div id="add-area">
    <input id="skill-name" type="text" placeholder="New subject...">
    <button id="add-btn">Add</button>
</div>

<div id="skills-container"></div>

<script>
/* ======================================================
   CONFIG
====================================================== */
const DECAY_RATE_PER_DAY = 0.05; 
// Skill reaches 0 in 20 days with no activity

/* ======================================================
   LOAD OR INIT LOCAL STORAGE
====================================================== */
let skills = JSON.parse(localStorage.getItem("decaySkills")) || [];

/* ======================================================
   SAVE
====================================================== */
function saveSkills() {
    localStorage.setItem("decaySkills", JSON.stringify(skills));
}

/* ======================================================
   DECAY MATH
====================================================== */
function calculateHealth(lastTrained) {
    const last = lastTrained;      // timestamp
    const now = Date.now();
    const diffDays = (now - last) / (1000 * 60 * 60 * 24);

    const decay = diffDays * DECAY_RATE_PER_DAY;
    const health = Math.max(0, 1 - decay);

    return Math.round(health * 100);
}


/* ======================================================
   ADD NEW SKILL
====================================================== */
document.getElementById("add-btn").addEventListener("click", () => {
    const name = document.getElementById("skill-name").value.trim();
    if (name === "") return;

    skills.push({
        id: Date.now(),
        name,
        lastTrained: Date.now()
    });

    saveSkills();
    renderSkills();

    document.getElementById("skill-name").value = "";
});

/* ======================================================
   DELETE SKILL
====================================================== */
function deleteSkill(id) {
    skills = skills.filter(s => s.id !== id);
    saveSkills();
    renderSkills();
}

/* ======================================================
   STUDY / UPDATE SKILL
====================================================== */
function studySkill(id) {
    const skill = skills.find(s => s.id === id);
    if (!skill) return;

    // Reset last trained to today
    skill.lastTrained = Date.now()

    saveSkills();
    renderSkills();
}

/* ======================================================
   RENDER GUI
====================================================== */
function renderSkills() {
    const container = document.getElementById("skills-container");
    container.innerHTML = "";

    skills.forEach(skill => {
        const health = calculateHealth(skill.lastTrained);

        let color;
        if (health > 60) color = "linear-gradient(90deg, #32ff4d, #4dff87)";
        else if (health > 30) color = "linear-gradient(90deg, #ffdd00, #ffb300)";
        else color = "linear-gradient(90deg, #ff4d4d, #ff1a1a)";

        const card = document.createElement("div");
        card.className = "skill";
        const readable = new Date(skill.lastTrained)
    .toLocaleDateString('en-US', { timeZone: 'America/Los_Angeles' });

        card.innerHTML = `
            <div class="skill-title">${skill.name}</div>
            <div class="bar-wrapper">
                <div 
                    class="health-bar" 
                    style="width:${health}%; background:${color};">
                </div>
            </div>
            <div class="last-trained">
                Last trained: ${readable}

            </div>

            <div class="btn-row">
                <button class="study-btn" onclick="studySkill(${skill.id})">
                    Study
                </button>
                <button class="delete-btn" onclick="deleteSkill(${skill.id})">
                    Delete
                </button>
            </div>
        `;

        container.appendChild(card);
    });
}

/* ======================================================
   INIT
====================================================== */
renderSkills();
setInterval(renderSkills, 10000);

/* ======================================================
   RENDER GUI (SECURE VERSION)
====================================================== */
function renderSkills() {
    const container = document.getElementById("skills-container");
    container.innerHTML = ""; // This is safe because you are clearing the container

    // 1. Calculate health for all skills and store it temporarily
    const skillsWithHealth = skills.map(skill => {
        const health = calculateHealth(skill.lastTrained);
        return {
            ...skill,
            health 
        };
    });

    // 2. SORT the skills array based on health (ascending: lowest health first)
    skillsWithHealth.sort((a, b) => a.health - b.health);


    // 3. Loop through the SORTED array and render the cards
    skillsWithHealth.forEach(skill => {
        const health = skill.health; 

        let color;
        if (health > 60) color = "linear-gradient(90deg, #32ff4d, #4dff87)";
        else if (health > 30) color = "linear-gradient(90deg, #ffdd00, #ffb300)";
        else color = "linear-gradient(90deg, #ff4d4d, #ff1a1a)";

        const card = document.createElement("div");
        card.className = "skill";
        
        // --- START: BUILDING THE CARD SECURELY ---
        
        // 1. Title Element
        const title = document.createElement("div");
        title.className = "skill-title";
        // *** SECURITY FIX: Use textContent for user input! ***
        title.textContent = skill.name; 
        
        // 2. Health Bar Wrapper (Using innerHTML for static, non-user-input HTML is fine)
        const barWrapper = document.createElement("div");
        barWrapper.className = "bar-wrapper";
        barWrapper.innerHTML = `
            <div 
                class="health-bar" 
                style="width:${health}%; background:${color};">
            </div>
        `;
        
        // 3. Last Trained Element
        const lastTrainedDiv = document.createElement("div");
        lastTrainedDiv.className = "last-trained";
        const readable = new Date(skill.lastTrained)
            .toLocaleDateString('en-US', { timeZone: 'America/Los_Angeles' });
        lastTrainedDiv.textContent = `Last trained: ${readable}`;
        
        // 4. Button Row (Using innerHTML for static, non-user-input HTML is fine)
        const btnRow = document.createElement("div");
        btnRow.className = "btn-row";
        btnRow.innerHTML = `
            <button class="study-btn" onclick="studySkill(${skill.id})">
                Study
            </button>
            <button class="delete-btn" onclick="deleteSkill(${skill.id})">
                Delete
            </button>
        `;

        // 5. Append all parts to the card
        card.appendChild(title);
        card.appendChild(barWrapper);
        card.appendChild(lastTrainedDiv);
        card.appendChild(btnRow);
        
        // --- END: BUILDING THE CARD SECURELY ---

        container.appendChild(card);
    });
}
</script>

</body>
</html>
