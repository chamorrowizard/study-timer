<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Bunny Timer</title>

<!-- Manifest for PWA -->
<link rel="manifest" href="manifest.json">

<!-- App Icons -->
<link rel="icon" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
    body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #fdf6e3;
    }

    h1 {
        margin-top: 20px;
        color: #ff7f95;
    }

    /* Bunny */
    .bunny {
        width: 160px;
        margin: 20px auto;
        cursor: pointer;
    }

    #bunnyHealthContainer {
        width: 200px;
        background: #ddd;
        border-radius: 20px;
        height: 20px;
        overflow: hidden;
        margin: 10px auto 20px;
    }

    #bunnyHealth {
        width: 100%;
        height: 100%;
        background: #89e089;
        transition: width 0.3s;
    }

    /* Subject List */
    #subjects {
        width: 90%;
        max-width: 400px;
        margin-top: 20px;
    }

    .subject {
        background: white;
        padding: 10px;
        border-radius: 10px;
        margin-bottom: 10px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }

    .bar {
        height: 10px;
        background: #89e0ff;
        border-radius: 20px;
        margin-top: 5px;
        transition: width 0.3s;
    }

    button {
        background: #ffb6c1;
        border: none;
        padding: 10px;
        border-radius: 8px;
        margin-top: 10px;
        cursor: pointer;
    }

    /* Timer section */
    #timerSection {
        margin-top: 20px;
        text-align: center;
    }

    #timeDisplay {
        font-size: 30px;
        margin: 10px 0;
    }
</style>

</head>
<body>

<h1>Study Bunny</h1>

<!-- Bunny -->
<img src="icons/bunny.png" class="bunny" id="bunny">
<div id="bunnyHealthContainer">
    <div id="bunnyHealth"></div>
</div>

<!-- Subjects -->
<div id="subjects"></div>
<button onclick="addSubject()">Add Subject</button>

<!-- Timer -->
<div id="timerSection">
    <h2>Timer</h2>
    <select id="subjectSelect"></select>
    <div id="timeDisplay">00:00</div>

    <button onclick="startTimer()">Start</button>
    <button onclick="stopTimer()">Stop</button>
    <button onclick="resetTimer()">Reset</button>
</div>

<script>
let subjects = [];
let timerInterval = null;
let seconds = 0;
let bunnyHealth = 100;

/* Load saved data */
if (localStorage.getItem("subjects")) {
    subjects = JSON.parse(localStorage.getItem("subjects"));
}
if (localStorage.getItem("bunnyHealth")) {
    bunnyHealth = localStorage.getItem("bunnyHealth");
}
updateUI();

/* Auto drain bunny health */
setInterval(() => {
    bunnyHealth -= 0.1;
    bunnyHealth = Math.max(0, bunnyHealth);
    saveData();
    updateUI();
}, 1000);

/* Add Subject */
function addSubject() {
    const name = prompt("Subject name?");
    if (name) {
        subjects.push({ name, time: 0 });
        saveData();
        updateUI();
    }
}

/* Delete Subject */
function deleteSubject(index) {
    subjects.splice(index, 1);
    saveData();
    updateUI();
}

/* Update UI */
function updateUI() {
    const container = document.getElementById("subjects");
    const dropdown = document.getElementById("subjectSelect");

    container.innerHTML = "";
    dropdown.innerHTML = "";

    subjects.forEach((sub, i) => {
        let percent = (sub.time / 3600) * 100;
        percent = Math.min(percent, 100);

        container.innerHTML += `
            <div class="subject">
                <strong>${sub.name}</strong>
                <div class="bar" style="width:${percent}%"></div>
                <button onclick="deleteSubject(${i})">Delete</button>
            </div>
        `;

        dropdown.innerHTML += `<option value="${i}">${sub.name}</option>`;
    });

    document.getElementById("bunnyHealth").style.width = bunnyHealth + "%";
}

/* Timer Functions */
function startTimer() {
    if (timerInterval) return;

    timerInterval = setInterval(() => {
        seconds++;
        document.getElementById("timeDisplay").textContent = formatTime(seconds);

        let i = document.getElementById("subjectSelect").value;
        if (subjects[i]) {
            subjects[i].time++;
        }

        bunnyHealth = Math.min(100, Number(bunnyHealth) + 0.1);

        saveData();
        updateUI();
    }, 1000);
}

function stopTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
}

function resetTimer() {
    seconds = 0;
    document.getElementById("timeDisplay").textContent = "00:00";
}

function formatTime(sec) {
    let m = Math.floor(sec / 60);
    let s = sec % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2,'0')}`;
}

/* Save progress */
function saveData() {
    localStorage.setItem("subjects", JSON.stringify(subjects));
    localStorage.setItem("bunnyHealth", bunnyHealth);
}

/* Service Worker Registration */
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
